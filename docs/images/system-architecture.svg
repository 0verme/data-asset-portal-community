<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">数据资产门户高层系统架构</title>
<desc id="desc">十个组件。主请求路径：React Web 门户经 Nginx 到 FastAPI、目录业务服务、数据库访问层及元数据存储。小程序与外部采集器复用入口；会话权限与接入服务位于同一后端进程。匿名目录访问受部署策略控制。</desc>
<style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#142133}.sub{font-size:16px;fill:#415268}.label{font-size:21px;font-weight:600}.boundary{fill:#f6f9fc;stroke:rgba(20, 33, 51, 0.18);stroke-dasharray:6 5}.node{fill:#ffffff;stroke:rgba(20, 33, 51, 0.18);stroke-width:1.5}.edge{fill:none;stroke:#415268;stroke-width:2;marker-end:url(#arrow)}.main{stroke-width:3}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#415268"/></marker></defs>
<rect width="960" height="790" fill="#ffffff"/>
<text x="32" y="38" font-size="25" font-weight="600">数据资产门户 / SYSTEM ARCHITECTURE</text>
<text x="32" y="65" class="sub">生产 remote 模式 · 粗线为资产查询路径 · 响应原路返回</text>
<rect class="boundary" x="24" y="315" width="912" height="370" rx="12"/>
<text x="44" y="344" class="sub">DAP 后端所有 · 同一 FastAPI / Uvicorn 进程 · 127.0.0.1:15099</text>
<rect class="boundary" x="690" y="697" width="246" height="78" rx="12"/>
<path class="edge main" d="M480 173V218"/>
<path class="edge" d="M165 173V255H362"/>
<path class="edge" d="M795 173V255H598"/>
<path class="edge main" d="M480 288V370"/>
<path class="edge main" d="M480 440V486"/>
<path class="edge main" d="M480 556V602"/>
<path class="edge main" d="M598 637H666V736H702"/>
<path class="edge" d="M598 405H702"/>
<path class="edge" d="M362 405H165V486"/>
<g id="mobile"><rect class="node" x="48" y="100" width="234" height="70" rx="12"/>
<text class="label" x="165" y="129" text-anchor="middle">微信小程序</text>
<text class="sub" x="165" y="153" text-anchor="middle">Taro · 只读客户端</text></g>
<g id="web"><rect class="node" x="363" y="100" width="234" height="70" rx="12"/>
<text class="label" x="480" y="129" text-anchor="middle">React Web 门户</text>
<text class="sub" x="480" y="153" text-anchor="middle">浏览器 · 资产查询</text></g>
<g id="collector"><rect class="node" x="678" y="100" width="234" height="70" rx="12"/>
<text class="label" x="795" y="129" text-anchor="middle">外部 Collector</text>
<text class="sub" x="795" y="153" text-anchor="middle">外部团队 · 采集 / 调度</text></g>
<g id="gateway"><rect class="node" x="363" y="218" width="234" height="70" rx="12"/>
<text class="label" x="480" y="247" text-anchor="middle">Nginx 入口</text>
<text class="sub" x="480" y="271" text-anchor="middle">静态资源 + /api 反代</text></g>
<g id="api"><rect class="node" x="363" y="370" width="234" height="70" rx="12"/>
<text class="label" x="480" y="399" text-anchor="middle">FastAPI 路由</text>
<text class="sub" x="480" y="423" text-anchor="middle">契约校验 · 请求上下文</text></g>
<g id="domain"><rect class="node" x="363" y="486" width="234" height="70" rx="12"/>
<text class="label" x="480" y="515" text-anchor="middle">目录业务服务</text>
<text class="sub" x="480" y="539" text-anchor="middle">资产 / 搜索 / 血缘 / 台账</text></g>
<g id="storage"><rect class="node" x="363" y="602" width="234" height="70" rx="12"/>
<text class="label" x="480" y="631" text-anchor="middle">数据库访问层</text>
<text class="sub" x="480" y="655" text-anchor="middle">CoreAccess · Provider</text></g>
<g id="identity"><rect class="node" x="702" y="370" width="234" height="70" rx="12"/>
<text class="label" x="819" y="399" text-anchor="middle">会话与 RBAC</text>
<text class="sub" x="819" y="423" text-anchor="middle">签名 Cookie · 权限码</text></g>
<g id="ingestion"><rect class="node" x="48" y="486" width="234" height="70" rx="12"/>
<text class="label" x="165" y="515" text-anchor="middle">元数据接入服务</text>
<text class="sub" x="165" y="539" text-anchor="middle">校验 / 持久化 / 审计</text></g>
<g id="database"><rect class="node" x="702" y="702" width="234" height="70" rx="12"/>
<text class="label" x="819" y="731" text-anchor="middle">元数据存储</text>
<text class="sub" x="819" y="755" text-anchor="middle">关系数据库 · 部署方所有</text></g>
<text class="sub" x="495" y="310">/api</text>
<text class="sub" x="48" y="590">接入服务复用存储能力</text>
<text class="sub" x="48" y="615">支持性调用见架构文档</text>
<text class="sub" x="32" y="721">数据库按配置选择：SQLite / PostgreSQL / MySQL / GaussDB-DWS</text>
<text class="sub" x="32" y="751">匿名读取受目录策略控制；元数据写入要求登录及权限。</text>
</svg>
