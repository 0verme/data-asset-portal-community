# Supported database types:
#   - sqlite    (Community/local isolated operation)
#   - postgres  (PostgreSQL)
#   - mysql     (MySQL 8.0 via optional PyMySQL dependency)
#   - gaussdb   (GaussDB / DWS via optional JDBC dependencies)

defaults:
  connect_timeout: 30
  statement_timeout_ms: 120000

profiles:
  sqlite_local:
    type: sqlite
    database: instance/community.db
  # Host/user/password/JDBC URL may be supplied by ASSET_DB_* environment overrides.
  
  primary:
    type: postgres
    host: 127.0.0.1
    port: 5432
    database: asset_portal
    schema: dwp
    user: change_me
    password: change_me

  mysql_primary:
    type: mysql
    host: 127.0.0.1
    port: 3306
    database: asset_portal
    user: change_me
    password: change_me
    charset: utf8mb4
    collation: utf8mb4_unicode_ci

  gauss_primary:
    type: gaussdb
    driver: com.huawei.gauss200.jdbc.Driver
    # Relative to backend/. ASSET_DB_JAR_PATH can override this per environment.
    jar_path: resources/jars/gaussdb200.jar
    jdbc_url: jdbc:gaussdb://127.0.0.1:25308/asset_portal?currentSchema=dwp
    schema: dwp
    user: change_me
    password: change_me
    socket_timeout: 120
