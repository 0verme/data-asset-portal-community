defaults:
  type: sqlite

profiles:
  community_sqlite:
    type: sqlite
    database: instance/community.db

  community_postgres:
    type: postgres
    host: 127.0.0.1
    port: 5432
    database: asset_portal_community
    schema: dwp
    user: community
    password: configure_via_environment

  community_mysql:
    type: mysql
    driver: pymysql
    host: 127.0.0.1
    port: 3306
    database: asset_portal_community
    user: community
    password: configure_via_environment
    charset: utf8mb4
    collation: utf8mb4_0900_ai_ci
