# Local SQLite demonstration profile.
# The profile selects database/bootstrap behavior only; repository modules are
# all available by default and are not selected by a product allowlist.
database:
  allowed_types:
    - sqlite
    - postgres
    - mysql
# These are integration/deployment switches only; they do not remove
# source-backed modules or unregister their routes.
features:
  lineage_collector: false
  audit_integration: false
  asset_risks: false
  enterprise_connectors: false
