name: 🐞 Bug Report / 问题反馈
description: 报告程序异常、连接失败、查询错误、界面显示错误或其他可复现问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！

        请尽量提供完整的复现步骤和环境信息，这将帮助我们更快定位问题。

        ⚠️ 请勿提交密码、Token、数据库连接串、内部地址等敏感信息。
        如日志包含敏感数据，请先脱敏。

  - type: input
    id: version
    attributes:
      label: 版本 / Commit
      description: 你当前使用的是哪个版本或 Commit？
      placeholder: "例如：v0.1.0 / 47710fa"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: 数据库
      description: 当前使用的数据源或后端数据库
      options:
        - SQLite
        - PostgreSQL
        - GaussDB / DWS
        - 不涉及 / 不确定
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 后端 API
        - 前端界面
        - 血缘可视化
        - 数据库迁移 / Schema
        - Demo / 示例数据
        - 安装 / 构建
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 问题复现步骤
      description: 请说明进行了什么操作，以及出现了什么问题。
      placeholder: |
        1. 启动……
        2. 打开……
        3. 点击……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正常情况下你认为应该发生什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误信息
      description: 请粘贴相关日志，并注意删除密码、Token、连接串等敏感信息。
      render: shell

  - type: input
    id: environment
    attributes:
      label: 环境信息
      placeholder: "例如：Windows 11 / Chrome 151 / Node 22 / Python 3.13"

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复问题
        - label: 我已删除日志中的密码、Token、连接串等敏感信息
    validations:
      required: true
