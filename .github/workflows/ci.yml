# CI — Community quality gates for data-asset-portal.
#
# Every PR and main push must pass:
#   1. Repository Guard  — public data guard (BLOCKER/SUSPICIOUS = 0), repo hygiene
#   2. Backend           — unit tests on Python 3.11 + 3.13, migration verify
#   3. PostgreSQL        — fresh migration -> seed -> integration tests on PG 16
#   4. Frontend          — npm ci / test / build on Node 22 + 24, audit gate
#   5. Community Migration — SQLite fresh apply / verify / seed / repeat no-op
#
# Security posture:
#   - read-only permissions (never write / packages / actions)
#   - CI uses `pull_request`; an allowlisted metadata-only workflow may use
#     `pull_request_target` without checkout or shell execution
#   - no production connectivity, no real secrets, no private registry
#   - all GitHub Actions pinned to immutable full commit SHAs
#   - ephemeral CI-only database credentials inside service containers

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Community edition module set; schema_migrate needs it explicitly because
  # a clean checkout has no .env.local to derive it from.
  COMMUNITY_MODULES: portal,dwm,mapping,lineage,root,indicator,apiAsset,system

jobs:
  repository-guard:
    name: Repository Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Repository Public Data Guard (BLOCKER and SUSPICIOUS must be 0)
        run: python demo/validate_demo_data.py --strict

      - name: git diff --check
        run: git diff --check

      - name: No binary / database dump artifacts tracked
        run: |
          set -euo pipefail
          BAD="$(git ls-files | grep -iE '\.(jar|dump|sqlite|db)$' || true)"
          if [ -n "$BAD" ]; then
            echo "Forbidden tracked artifacts found:"; echo "$BAD"; exit 1
          fi
          if git ls-files | grep -q '^backend/resources/jars/.*\.jar$'; then
            echo "GaussDB commercial JDBC jar must never be tracked"; exit 1
          fi
          echo "No tracked jar / dump / database artifacts."

      - name: No local-only or environment files tracked
        run: |
          set -euo pipefail
          BAD="$(git ls-files | grep -E '(^|/)(\.env|\.env\.local)$|database\.yaml$|database\.local' || true)"
          if [ -n "$BAD" ]; then
            echo "Environment/local config must not be tracked:"; echo "$BAD"; exit 1
          fi
          echo "No tracked local environment files."

      - name: Workflow YAML self-check
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          import yaml
          expected_triggers = {
              "ci.yml": {"pull_request"},
              "community-metadata.yml": {"issues", "pull_request_target"},
              "release-drafter.yml": {"push"},
          }
          metadata_actions = {
              "actions/first-interaction",
              "actions/labeler",
          }
          sha_ref = re.compile(r"^[^@\s]+@[0-9a-f]{40}$")
          ok = True
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              try:
                  # GitHub Actions uses YAML 1.2 where `on` is a plain key;
                  # PyYAML is YAML 1.1 and would parse `on` as bool, so the
                  # top-level trigger key is renamed before parsing.
                  text = path.read_text(encoding="utf-8")
                  data = yaml.safe_load(text.replace("\non:", "\ntriggers:", 1))
                  assert "triggers" in data, "missing trigger key"
                  required = expected_triggers.get(path.name)
                  assert required, "workflow is not included in the trigger policy"
                  assert required <= set(data["triggers"]), f"missing required trigger(s): {required}"
                  assert data.get("permissions", {}).get("contents") == "read", "top-level contents permission must be read-only"

                  jobs = data.get("jobs", {}).values()
                  steps = [step for job in jobs for step in job.get("steps", [])]
                  for step in steps:
                      action = step.get("uses")
                      if action:
                          assert sha_ref.fullmatch(action), f"action must use a full commit SHA: {action}"

                  if "pull_request_target" in data["triggers"]:
                      assert path.name == "community-metadata.yml", "pull_request_target is not allowlisted"
                      assert data["permissions"] == {
                          "contents": "read",
                          "issues": "write",
                          "pull-requests": "write",
                      }, "metadata workflow permissions changed"
                      for step in steps:
                          assert "run" not in step, "metadata workflow must not execute shell commands"
                          action = step.get("uses", "").split("@", 1)[0]
                          assert action in metadata_actions, f"metadata action is not allowlisted: {action}"
                  print(f"workflow ok: {path}")
              except Exception as exc:
                  ok = False
                  print(f"workflow invalid: {path}: {exc}")
          if not ok:
              sys.exit(1)
          EOF

  backend:
    name: Backend / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Community backend unit tests (0 failures, 0 errors)
        run: python -m unittest discover -s backend/tests

      - name: Migration manifest offline verify (SQLite / PostgreSQL / DWS)
        run: |
          python backend/scripts/schema_migrate.py verify --offline --dialect sqlite
          python backend/scripts/schema_migrate.py verify --offline --dialect postgresql
          python backend/scripts/schema_migrate.py verify --offline --dialect dws

      - name: Packaging contract tests (clean-clone reproducibility)
        run: python -m unittest discover -s backend/tests -p "test_packaging_contracts.py"

  postgres:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Ephemeral CI-only credentials; never real user/host.
      TEST_DATABASE_PROFILE: pg_ci
      TEST_DATABASE_CONFIG_PATH: /tmp/pg-ci-config.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Create isolated test schema
        run: |
          python - <<'EOF'
          import psycopg
          conn = psycopg.connect(host="127.0.0.1", port=5432, dbname="test",
                                 user="postgres", password="postgres")
          conn.autocommit = True
          conn.execute("DROP SCHEMA IF EXISTS dwp CASCADE")
          conn.execute("CREATE SCHEMA dwp")
          print("schema dwp ready")
          conn.close()
          EOF

      - name: Write ephemeral PostgreSQL test config
        run: |
          cat > /tmp/pg-ci-config.yaml <<'YAML'
          defaults:
            type: postgres
            connect_timeout: 10
            statement_timeout_ms: 120000
          profiles:
            pg_ci:
              type: postgres
              host: 127.0.0.1
              port: 5432
              database: test
              schema: dwp
              user: postgres
              password: postgres
          YAML

      - name: Fresh migration apply
        run: python backend/scripts/schema_migrate.py apply --profile pg_ci --config /tmp/pg-ci-config.yaml --modules "$COMMUNITY_MODULES"

      - name: Migration verify
        run: python backend/scripts/schema_migrate.py verify --profile pg_ci --config /tmp/pg-ci-config.yaml --modules "$COMMUNITY_MODULES"

      - name: Migration status (Alembic head)
        run: |
          STATUS="$(python backend/scripts/schema_migrate.py status --profile pg_ci --config /tmp/pg-ci-config.yaml --modules "$COMMUNITY_MODULES")"
          echo "$STATUS"
          case "$STATUS" in
            *"revision=0002_portable_asset_filter"*) : ;;
            *) echo "unexpected Alembic migration state"; exit 1 ;;
          esac

      - name: Seed Community demo data (PostgreSQL)
        run: |
          python demo/seed_postgres.py --dialect postgres > /tmp/pg-seed.sql
          python - <<'EOF'
          import psycopg
          conn = psycopg.connect(host="127.0.0.1", port=5432, dbname="test",
                                 user="postgres", password="postgres")
          conn.autocommit = True
          conn.execute("SET search_path TO dwp")
          conn.execute(open("/tmp/pg-seed.sql", encoding="utf-8").read())
          print("seed applied")
          conn.close()
          EOF

      - name: Repeat migration apply must be a no-op
        run: |
          OUT="$(python backend/scripts/schema_migrate.py apply --profile pg_ci --config /tmp/pg-ci-config.yaml --modules "$COMMUNITY_MODULES")"
          echo "$OUT"
          case "$OUT" in *"applied=-"*) ;; *) echo "repeat apply was not a no-op"; exit 1 ;; esac

      - name: Physical Community boundary (private relations absent)
        run: |
          python - <<'EOF'
          import psycopg, sys
          conn = psycopg.connect(host="127.0.0.1", port=5432, dbname="test",
                                 user="postgres", password="postgres")
          cur = conn.cursor()
          cur.execute("SELECT table_name FROM information_schema.tables "
                      "WHERE table_schema='dwp' AND table_type='BASE TABLE'")
          tables = [r[0] for r in cur.fetchall()]
          markers = ("push", "upstream", "report", "code_table")
          private = [t for t in tables if any(m in t for m in markers)]
          print(f"total tables: {len(tables)}")
          if private:
              print("PRIVATE TABLES PRESENT:", private)
              sys.exit(1)
          print("private tables: 0 — boundary OK")
          EOF

      - name: Backend tests with PostgreSQL integration enabled (0 skipped)
        run: python -m unittest discover -s backend/tests

  frontend:
    name: Frontend / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci (clean install from lockfile)
        run: npm ci

      - name: Lineage workspace packages resolve inside the repository
        run: |
          npm ls lineage-viewer @lineage-viewer/react @lineage-viewer/domain-adapter --depth=0
          node - <<'EOF'
          const fs = require("fs");
          for (const pkg of ["lineage-viewer", "@lineage-viewer/react", "@lineage-viewer/domain-adapter"]) {
            const p = require.resolve(`${pkg}/package.json`);
            if (!p.includes(`${process.cwd()}/packages/`)) {
              console.error(`workspace package ${pkg} resolved outside repository: ${p}`);
              process.exit(1);
            }
            console.log(`${pkg} -> ${p}`);
          }
          EOF

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Dependency audit gate (Critical/High must be 0)
        run: npm audit --audit-level=high

  migration-community:
    name: Community Migration (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Community Demo init-only (fresh)
        run: python scripts/community_demo.py --init-only

      - name: Community Demo init-only (repeat must remain idempotent)
        run: python scripts/community_demo.py --init-only
