name: Community Metadata

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome First-Time Contributors
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Post first-interaction guidance
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            感谢你的首次参与！维护者会尽力审阅；如果是使用问题，也欢迎前往 Discussions 交流。

            Thanks for your first contribution! A maintainer will review it as time allows. Usage questions are also welcome in Discussions.
          pr_message: |
            感谢你的首个 Pull Request！请确保已说明测试结果，并已移除凭据、内部数据和真实连接串。

            Thanks for your first pull request! Please include test results and make sure no credentials, internal data, or real connection strings are present.

  label:
    name: Label Pull Request Paths
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Apply path labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false
