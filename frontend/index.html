<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-mode="light" data-accent="green">
<head>
<meta charset="UTF-8" />
<script>
  (() => {
    const root = document.documentElement;
    const configuredDefault = "%VITE_DEFAULT_ACCENT%".trim().toLowerCase();
    const defaultAccent = configuredDefault === "purple" ? "purple" : "green";
    let theme = "light";
    let accent = defaultAccent;

    try {
      const storage = window.localStorage;
      const savedTheme = storage.getItem("dap-theme");
      const savedAccent = storage.getItem("dap-accent");
      if (savedTheme === "dark") theme = "dark";
      if (savedAccent === "green" || savedAccent === "purple") accent = savedAccent;
    } catch {
      // Fall back to build defaults when local storage is unavailable.
    }

    root.dataset.theme = theme;
    root.dataset.mode = theme;
    root.dataset.accent = accent;
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>数据资产管理与血缘分析平台</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
